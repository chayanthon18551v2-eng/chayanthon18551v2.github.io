<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบ ลำดับเรขาคณิต</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c16; /* สีพื้นหลังมืดแบบในรูป */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

       
        .main-container {
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
            text-align: center;
        }

        .subtitle {
            color: #a855f7;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .title {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .quiz-box {
            background-color: #111424; /* สีกล่องน้ำเงินเข้ม */
            border: 1px solid #1e2235;
            border-radius: 16px;
            padding: 30px;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .score-badge {
            background-color: #1e1b4b;
            color: #c084fc;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #581c87;
        }

        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .timer-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #a855f7; /* วงกลมสีม่วง */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        #time-left {
            font-size: 24px;
            font-weight: bold;
        }

        .timer-label {
            font-size: 10px;
            color: #8b949e;
        }

        .sub-label {
            font-size: 12px;
            color: #8b949e;
            margin-top: 5px;
        }

        .question {
            font-size: 20px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background-color: #161b33;
            border: 1px solid #2d3748;
            color: #ffffff;
            padding: 16px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            display: flex;
            align-items: center;
            transition: 0.2s;
            width: 100%;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #1e2548;
            border-color: #4a5568;
        }

        .prefix {
            background-color: #0f1222;
            padding: 4px 10px;
            border-radius: 6px;
            margin-right: 15px;
            color: #8b949e;
            font-size: 14px;
        }

        .correct {
            background-color: #064e3b !important;
            border-color: #059669 !important;
        }

        .wrong {
            background-color: #7f1d1d !important;
            border-color: #dc2626 !important;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            text-align: center;
            display: block;
            text-decoration: none;
        }

        .action-btn:hover {
            background-color: #1d4ed8;
        }

        .restart {
            background-color: #a855f7;
        }
        .restart:hover {
            background-color: #9333ea;
        }

        .back-canva {
            background-color: #3b4252;
            margin-top: 10px;
        }
        .back-canva:hover {
            background-color: #4c566a;
        }

        .hide {
            display: none !important;
        }

        .final-score-text {
            font-size: 24px;
            color: #a855f7;
            margin: 15px 0 25px 0;
            text-align: center;
        }

        .review-container {
            margin: 15px 0 25px 0;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .review-item {
            background-color: #161b33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 15px;
            border-left: 5px solid #3b4252;
            text-align: left;
        }

        .review-item.pass {
            border-left-color: #10b981;
        }

        .review-item.fail {
            border-left-color: #ef4444;
        }

        .review-item p {
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <p class="subtitle">ทดสอบความเข้าใจ</p>
        <h1 class="title">แบบทดสอบ 5 ข้อ</h1>

        <div id="quiz-card" class="quiz-box">
            <div class="quiz-header">
                <span id="question-number">ข้อที่ 1 / 5</span>
                <span id="score-display" class="score-badge">คะแนน: 0</span>
            </div>

            <div class="timer-container">
                <div class="timer-circle">
                    <span id="time-left">30</span>
                    <span class="timer-label">วินาที</span>
                </div>
                <p class="sub-label">เหลือเวลา</p>
            </div>

            <h2 id="question-text" class="question">กำลังโหลดคำถาม...</h2>

            <div id="answer-options" class="options-grid"></div>

            <button id="next-btn" class="action-btn hide">ข้อถัดไป</button>
        </div>

        <div id="result-card" class="quiz-box hide">
            <h2 style="text-align: center;">สรุปผลคะแนน</h2>
            <div id="final-score" class="final-score-text">คุณได้คะแนน 0 เต็ม 5</div>
            
            <h3 style="margin-bottom: 10px;">รายละเอียดการตอบของคุณ:</h3>
            <div id="review-section" class="review-container"></div>

            <div style="margin-top: 20px;">
                <button id="restart-btn" class="action-btn restart">ทำแบบทดสอบอีกครั้ง</button>
                <a href="https://chayanthon2athibodi4.my.canva.site/" class="action-btn back-canva">กลับไปที่หน้าหลัก (Canva)</a>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "1. อนุกรมเรขาคณิตอนันต์จะลู่เข้า (Convergent) เมื่อใด?",
                answers: ["|r| > 1", "|r| = 1", "|r| < 1", "r = 0 เท่านั้น"],
                correct: 2
            },
            {
                question: "2. ลำดับเรขาคณิต 2, 4, 8, 16, ... มีอัตราส่วนร่วม (r) เท่ากับเท่าใด?",
                answers: ["r = 2", "r = 4", "r = 6", "r = 8"],
                correct: 0
            },
            {
                question: "3. สูตรพจน์ทั่วไป (an) ของลำดับเรขาคณิตคือข้อใด?",
                answers: ["an = a1 + (n-1)d", "an = a1 · r^(n-1)", "an = a1 · r^n", "an = n · a1 · r"],
                correct: 1
            },
            {
                question: "4. ถ้าลำดับเรขาคณิตมี a1 = 3 และ r = 2 พจน์ที่ 3 (a3) จะมีค่าเท่าใด?",
                answers: ["6", "9", "12", "18"],
                correct: 2
            },
            {
                question: "5. ลำดับในข้อใดต่อไปนี้ *ไม่ใช่* ลำดับเรขาคณิต?",
                answers: ["1, 3, 9, 27", "5, 10, 20, 40", "2, 4, 6, 8", "10, -20, 40, -80"],
                correct: 2
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let timeLeft = 30;
        let timerInterval;
        let userAnswers = [];

        const quizCard = document.getElementById('quiz-card');
        const resultCard = document.getElementById('result-card');
        const questionNumberElement = document.getElementById('question-number');
        const scoreDisplay = document.getElementById('score-display');
        const timeLeftElement = document.getElementById('time-left');
        const questionText = document.getElementById('question-text');
        const answerOptions = document.getElementById('answer-options');
        const nextButton = document.getElementById('next-btn');
        const finalScore = document.getElementById('final-score');
        const reviewSection = document.getElementById('review-section');
        const restartButton = document.getElementById('restart-btn');

        const choicePrefix = ["ก", "ข", "ค", "ง"];

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];
            quizCard.classList.remove('hide');
            resultCard.classList.add('hide');
            scoreDisplay.innerHTML = `คะแนน: ${score}`;
            showQuestion();
        }

        function showQuestion() {
            nextButton.classList.add('hide');
            answerOptions.innerHTML = '';
            
            timeLeft = 30;
            timeLeftElement.innerText = timeLeft;
            startTimer();

            let currentQuestion = quizData[currentQuestionIndex];
            questionNumberElement.innerText = `ข้อที่ ${currentQuestionIndex + 1} / ${quizData.length}`;
            questionText.innerText = currentQuestion.question;

            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.classList.add('option-btn');
                button.innerHTML = `<span class="prefix">${choicePrefix[index]}</span> ${answer}`;
                button.addEventListener('click', () => selectAnswer(index));
                answerOptions.appendChild(button);
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timeLeftElement.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoTimeOut();
                }
            }, 1000);
        }

        function selectAnswer(selectedIndex) {
            clearInterval(timerInterval);
            const currentQuestion = quizData[currentQuestionIndex];
            const buttons = answerOptions.children;

            userAnswers.push(selectedIndex);

            if (selectedIndex === currentQuestion.correct) {
                buttons[selectedIndex].classList.add('correct');
                score++;
                scoreDisplay.innerHTML = `คะแนน: ${score}`;
            } else {
                buttons[selectedIndex].classList.add('wrong');
                buttons[currentQuestion.correct].classList.add('correct');
            }

            for (let button of buttons) {
                button.disabled = true;
            }
            nextButton.classList.remove('hide');
        }

        function autoTimeOut() {
            userAnswers.push(-1);
            const currentQuestion = quizData[currentQuestionIndex];
            const buttons = answerOptions.children;

            buttons[currentQuestion.correct].classList.add('correct');
            
            for (let button of buttons) {
                button.disabled = true;
            }
            nextButton.classList.remove('hide');
        }

        function showResult() {
            quizCard.classList.add('hide');
            resultCard.classList.remove('hide');
            finalScore.innerText = `คุณได้คะแนน ${score} เต็ม ${quizData.length}!`;

            reviewSection.innerHTML = '';

            quizData.forEach((data, index) => {
                const userChoice = userAnswers[index];
                const isCorrect = userChoice === data.correct;
                
                const reviewItem = document.createElement('div');
                reviewItem.classList.add('review-item');
                reviewItem.classList.add(isCorrect ? 'pass' : 'fail');

                let textHTML = `<p><strong>ข้อที่ ${index + 1}: ${data.question}</strong></p>`;
                
                if (userChoice === -1) {
                    textHTML += `<p style="color: #ef4444;">❌ คุณตอบ: หมดเวลา (ไม่เลือกคำตอบ)</p>`;
                } else {
                    const userText = `${choicePrefix[userChoice]}. ${data.answers[userChoice]}`;
                    textHTML += `<p style="${isCorrect ? 'color: #10b981;' : 'color: #ef4444;'}">${isCorrect ? '✅' : '❌'} คุณตอบ: ${userText}</p>`;
                }

                if (!isCorrect) {
                    const correctText = `${choicePrefix[data.correct]}. ${data.answers[data.correct]}`;
                    textHTML += `<p style="color: #10b981;">💡 คำตอบที่ถูกคือ: ${correctText}</p>`;
                }

                reviewItem.innerHTML = textHTML;
                reviewSection.appendChild(reviewItem);
            });
        }

        nextButton.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                showQuestion();
            } else {
                showResult();
            }
        });

        restartButton.addEventListener('click', startQuiz);

        startQuiz();
    </script>
</body>
</html>
